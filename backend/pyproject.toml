[project]
name = "ifb-backend"
version = "0.1.0"
description = "Instituto Fiscaliza Brasil - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.19",
    "email-validator==2.2.0",
    "beautifulsoup4==4.12.3",
    "pgvector==0.3.6",
    "sentry-sdk[fastapi]==2.19.2",
    "prometheus-client==0.21.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "aiofiles==24.1.0",
    "pyotp==2.9.0",
    "qrcode[pil]==8.0",
    "aiosmtplib==3.0.2",
    "jinja2==3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "T20"]
ignore = ["S101", "COM812"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
